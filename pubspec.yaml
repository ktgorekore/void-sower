name: void_sower
description: "Void Sower: Bao Orbital Batteries - Tactical African-inspired arcade shooter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.8
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  google_sign_in: ^6.2.2
  in_app_purchase: ^3.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/
  shaders:
    - shaders/particle_lance.frag
    - shaders/flak_burst.frag
    - shaders/plasma_capacitor.frag
    - shaders/atmospheric_siphon.frag

