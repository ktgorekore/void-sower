name: Release Android App Bundle & GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as Draft Release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release / Internal Test'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build_and_release:
    name: 🚀 Quality Gate, Build Release Bundle (.aab) & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Native C++ Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang clang-format g++ libstdc++-12-dev

      - name: Install Flutter Dependencies
        run: |
          flutter pub get

      - name: Audit Code Style & License Compliance
        run: |
          python3 scripts/verify_format.py --all

      - name: Build & Run Native C++ Engine GTests
        run: |
          cmake -B build -S src -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          ctest --test-dir build --output-on-failure

      - name: Run Flutter Static Analysis & Test Suites
        run: |
          flutter analyze
          flutter test

      - name: Configure Android Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "[*] Decoding Android upload keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat << PROPERTIES > android/key.properties
            storePassword=$STORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=upload-keystore.jks
          PROPERTIES
            echo "[+] Release signing configured via key.properties."
          else
            echo "[!] No release keystore secrets found. Falling back to debug signing for testing bundle."
          fi

      - name: Build Optimized Android App Bundle (.aab)
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --tree-shake-icons

      - name: Audit Android 15 16 KB Page Size Alignment
        run: |
          bash scripts/verify_16kb_alignment.sh build

      - name: Package Artifacts & Calculate Hashes
        id: artifacts
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          AAB_SRC="build/app/outputs/bundle/release/app-release.aab"
          AAB_DEST="build/app/outputs/bundle/release/void-sower-${TAG}.aab"
          cp "$AAB_SRC" "$AAB_DEST"
          
          # Package Dart Obfuscation Symbols
          SYMBOLS_ZIP="build/app/outputs/symbols/void-sower-symbols-${TAG}.zip"
          zip -r "$SYMBOLS_ZIP" build/app/outputs/symbols/
          
          AAB_SHA256=$(sha256sum "$AAB_DEST" | awk '{print $1}')
          AAB_SIZE_MB=$(echo "scale=2; $(stat -c%s "$AAB_DEST" 2>/dev/null || stat -f%z "$AAB_DEST") / 1048576" | bc)
          
          echo "aab_dest=$AAB_DEST" >> $GITHUB_OUTPUT
          echo "symbols_zip=$SYMBOLS_ZIP" >> $GITHUB_OUTPUT
          echo "aab_sha256=$AAB_SHA256" >> $GITHUB_OUTPUT
          echo "aab_size_mb=$AAB_SIZE_MB" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ### 🎮 Void Sower: Bao Orbital Batteries Release ${{ steps.vars.outputs.tag }}
            
            #### 📦 Release Artifacts:
            * **Android App Bundle (.aab):** `void-sower-${{ steps.vars.outputs.tag }}.aab` (${{ steps.artifacts.outputs.aab_size_mb }} MB)
            * **SHA-256 Checksum:** `${{ steps.artifacts.outputs.aab_sha256 }}`
            * **Dart Obfuscation Symbols:** `void-sower-symbols-${{ steps.vars.outputs.tag }}.zip`
            
            #### 🚀 Deployment Instructions:
            1. Download `void-sower-${{ steps.vars.outputs.tag }}.aab` and upload to **Google Play Console > Internal Testing / Production**.
            2. Upload `void-sower-symbols-${{ steps.vars.outputs.tag }}.zip` to Crashlytics / Play Console for stack trace de-obfuscation.
            3. Fully audited for **Android 15 16 KB ELF memory page alignment**.
          files: |
            ${{ steps.artifacts.outputs.aab_dest }}
            ${{ steps.artifacts.outputs.symbols_zip }}
