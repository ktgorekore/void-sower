name: Continuous Integration & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality, C++ Engine & Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Native C++ Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang clang-format g++ libstdc++-12-dev

      - name: Install Flutter Dependencies
        run: |
          flutter pub get

      - name: Audit Code Style & License Compliance
        run: |
          python3 scripts/verify_format.py --all

      - name: Build & Run Native C++ Engine GTest Suites
        run: |
          cmake -B build -S src -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          ctest --test-dir build --output-on-failure

      - name: Verify Android 15 16 KB Memory Page Alignment
        run: |
          bash scripts/verify_16kb_alignment.sh build

      - name: Run Flutter Static Analysis
        run: |
          flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: |
          flutter test --coverage
