<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" width="100%" height="100%" style="background:#05070f; border-radius:36px; box-shadow:0 25px 60px rgba(0,0,0,0.85); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="glow-gold2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="active-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c233c" />
      <stop offset="100%" stop-color="#071322" />
    </linearGradient>
  </defs>

  <!-- SCREEN BACKGROUND -->
  <rect width="400" height="860" rx="36" fill="#05070f" />

  <!-- STATUS BAR -->
  <rect x="145" y="10" width="110" height="28" rx="14" fill="#000000" />
  <circle cx="162" cy="24" r="4.5" fill="#0f172a" />
  <text x="35" y="28" fill="#64748b" font-size="12" font-weight="600">3:56</text>

  <!-- ============================================================== -->
  <!-- 1. SECTOR HEADER & PROGRESS -->
  <!-- ============================================================== -->
  <g transform="translate(20, 52)">
    <text x="0" y="10" fill="#38bdf8" font-size="8.5" font-weight="800" letter-spacing="1.5">VOID SOWER // ORBITAL COMMAND</text>
    <text x="0" y="32" fill="#ffffff" font-size="20" font-weight="900">KILWA NEBULA BASIN</text>
    
    <!-- Liberation Progress Tag -->
    <g transform="translate(260, 10)">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#032541" stroke="#00f0ff" stroke-width="1" />
      <circle cx="14" cy="13" r="5" fill="#00f0ff" />
      <text x="26" y="17" fill="#e0f2fe" font-size="9" font-weight="800">LIBERATED 5/9</text>
    </g>

    <!-- Progress Track -->
    <rect x="0" y="44" width="360" height="4" rx="2" fill="#1e293b" />
    <rect x="0" y="44" width="200" height="4" rx="2" fill="#00f0ff" filter="url(#glow-cyan2)" />
  </g>

  <!-- SUB-BASIN TABS -->
  <g transform="translate(20, 116)">
    <rect x="0" y="0" width="112" height="32" rx="16" fill="#0284c7" />
    <text x="56" y="20" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">KILWA BASIN</text>

    <rect x="120" y="0" width="112" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="176" y="20" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">PHANTOM DRIFT</text>

    <rect x="240" y="0" width="120" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="300" y="20" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">VOID SWARM</text>
  </g>

  <!-- ============================================================== -->
  <!-- 2. CAMPAIGN SECTOR PROGRESSION LIST (NO TRUNCATION!) -->
  <!-- ============================================================== -->
  <g transform="translate(20, 168)">
    
    <!-- Progression Line Guide -->
    <line x1="20" y1="20" x2="20" y2="480" stroke="#1e293b" stroke-width="2" />
    <line x1="20" y1="20" x2="20" y2="280" stroke="#00f0ff" stroke-width="2" />

    <!-- SECTOR 1 (COMPLETED) -->
    <g transform="translate(0, 0)">
      <circle cx="20" cy="28" r="12" fill="#0284c7" />
      <path d="M15 28 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="1.8" />
      <rect x="44" y="0" width="316" height="56" rx="14" fill="#0a101d" stroke="#1e293b" stroke-width="1" />
      <text x="58" y="22" fill="#ffffff" font-size="12" font-weight="800">Zanzibar Reef Gate</text>
      <text x="58" y="38" fill="#64748b" font-size="9" font-weight="600">Outer Bastions • Tier 1</text>
      <text x="290" y="22" fill="#fbbf24" font-size="10" font-weight="800">★★★</text>
      <text x="290" y="38" fill="#94a3b8" font-size="8.5" font-weight="600">1,200 PTS</text>
    </g>

    <!-- SECTOR 2 (COMPLETED) -->
    <g transform="translate(0, 68)">
      <circle cx="20" cy="28" r="12" fill="#0284c7" />
      <path d="M15 28 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="1.8" />
      <rect x="44" y="0" width="316" height="56" rx="14" fill="#0a101d" stroke="#1e293b" stroke-width="1" />
      <text x="58" y="22" fill="#ffffff" font-size="12" font-weight="800">Pemba Channel Trench</text>
      <text x="58" y="38" fill="#64748b" font-size="9" font-weight="600">Outer Bastions • Tier 1</text>
      <text x="290" y="22" fill="#fbbf24" font-size="10" font-weight="800">★★★</text>
      <text x="290" y="38" fill="#94a3b8" font-size="8.5" font-weight="600">1,650 PTS</text>
    </g>

    <!-- SECTOR 3 (COMPLETED) -->
    <g transform="translate(0, 136)">
      <circle cx="20" cy="28" r="12" fill="#0284c7" />
      <path d="M15 28 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="1.8" />
      <rect x="44" y="0" width="316" height="56" rx="14" fill="#0a101d" stroke="#1e293b" stroke-width="1" />
      <text x="58" y="22" fill="#ffffff" font-size="12" font-weight="800">Kaskazi Ion Straits</text>
      <text x="58" y="38" fill="#64748b" font-size="9" font-weight="600">Monsoon Straits • Tier 2</text>
      <text x="290" y="22" fill="#fbbf24" font-size="10" font-weight="800">★★☆</text>
      <text x="290" y="38" fill="#94a3b8" font-size="8.5" font-weight="600">3,400 PTS</text>
    </g>

    <!-- SECTOR 4: ACTIVE OBJECTIVE (PROMINENT ENGAGE CARD) -->
    <g transform="translate(0, 204)">
      <!-- Animated Pulsing Node -->
      <circle cx="20" cy="38" r="14" fill="#042747" stroke="#00f0ff" stroke-width="2" filter="url(#glow-cyan2)" />
      <circle cx="20" cy="38" r="6" fill="#00f0ff" />
      
      <!-- Highlighted Objective Card -->
      <rect x="44" y="0" width="316" height="76" rx="16" fill="url(#active-card)" stroke="#00f0ff" stroke-width="1.5" />
      
      <rect x="58" y="10" width="72" height="15" rx="7.5" fill="#0284c7" />
      <text x="94" y="21" fill="#ffffff" font-size="7.5" font-weight="900" letter-spacing="0.5" text-anchor="middle">ACTIVE SIEGE</text>
      
      <text x="58" y="42" fill="#ffffff" font-size="14" font-weight="900">Lindi Ridge Bastion</text>
      <text x="58" y="58" fill="#94a3b8" font-size="9.5" font-weight="600">Monsoon Straits • Tier 2 Corridors</text>
      
      <!-- Primary Action Button: ENGAGE -->
      <g transform="translate(242, 18)">
        <rect x="0" y="0" width="104" height="40" rx="20" fill="#00f0ff" filter="url(#glow-cyan2)" />
        <polygon points="22,20 30,14 30,26" fill="#04182b" />
        <text x="40" y="25" fill="#04182b" font-size="11" font-weight="900" letter-spacing="0.5">ENGAGE</text>
      </g>
    </g>

    <!-- SECTOR 5 (LOCKED BOSS SECTOR) -->
    <g transform="translate(0, 294)">
      <circle cx="20" cy="28" r="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <path d="M17 28 h6 v5 h-6 z M18 28 v-3 a2 2 0 0 1 4 0 v3" fill="none" stroke="#64748b" stroke-width="1.2" />
      <rect x="44" y="0" width="316" height="56" rx="14" fill="#080c16" stroke="#1e293b" stroke-width="1" opacity="0.6" />
      <text x="58" y="22" fill="#64748b" font-size="12" font-weight="800">Kilwa Kisiwani Citadel</text>
      <text x="58" y="38" fill="#475569" font-size="9" font-weight="600">Core Siphon • Boss Dreadnought (Tier 3)</text>
      <text x="310" y="30" fill="#64748b" font-size="10" font-weight="800">LOCKED</text>
    </g>

    <!-- SECTOR 6 (LOCKED) -->
    <g transform="translate(0, 362)">
      <circle cx="20" cy="28" r="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <rect x="44" y="0" width="316" height="56" rx="14" fill="#080c16" stroke="#1e293b" stroke-width="1" opacity="0.4" />
      <text x="58" y="22" fill="#475569" font-size="12" font-weight="800">Songo Mnara Flagship</text>
      <text x="58" y="38" fill="#334155" font-size="9" font-weight="600">Tier 3 Flagship Encounter</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 3. BOTTOM GLOBAL COMMAND NAVIGATION TABS -->
  <!-- ============================================================== -->
  <g transform="translate(0, 776)">
    <rect x="0" y="0" width="400" height="84" fill="#070c16" stroke="#1e293b" stroke-width="1" />

    <!-- 1. SECTORS (ACTIVE) -->
    <g transform="translate(42, 14)">
      <circle cx="14" cy="14" r="12" fill="#00f0ff" fill-opacity="0.15" />
      <path d="M8 10 l6 -3 l6 3 v8 c0 4 -6 6 -6 6 s-6 -2 -6 -6 z" fill="none" stroke="#00f0ff" stroke-width="1.5" />
      <text x="14" y="36" fill="#00f0ff" font-size="8.5" font-weight="800" text-anchor="middle">SECTORS</text>
    </g>

    <!-- 2. FLEET -->
    <g transform="translate(118, 14)">
      <polygon points="14,8 20,20 14,17 8,20" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">FLEET</text>
    </g>

    <!-- 3. PILOT -->
    <g transform="translate(194, 14)">
      <circle cx="14" cy="12" r="4" fill="none" stroke="#64748b" stroke-width="1.5" />
      <path d="M8 22 c0 -3 3 -4 6 -4 s6 1 6 4" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">PILOT</text>
    </g>

    <!-- 4. DIRECTIVES -->
    <g transform="translate(270, 14)">
      <rect x="8" y="9" width="12" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
      <line x1="11" y1="13" x2="17" y2="13" stroke="#64748b" stroke-width="1.2" />
      <line x1="11" y1="17" x2="15" y2="17" stroke="#64748b" stroke-width="1.2" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">DIRECTIVES</text>
    </g>

    <!-- 5. SETTINGS -->
    <g transform="translate(344, 14)">
      <circle cx="14" cy="15" r="4" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">SETTINGS</text>
    </g>
  </g>

  <!-- HOME SWIPE BAR -->
  <rect x="135" y="846" width="130" height="4" rx="2" fill="#334155" />
</svg>