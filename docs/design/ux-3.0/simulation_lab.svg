  <!-- ============================================================== -->
  <!-- 3. AI TACTICAL SOLVER PREDICTION PANEL -->
  <!-- ============================================================== -->
  <g transform="translate(20, 416)">
    <!-- Subheader -->
    <text x="0" y="12" fill="#38bdf8" font-size="9" font-weight="900" letter-spacing="1">AI TACTICAL ANALYSIS // MCTS DEPTH 8</text>

    <!-- Tactical Recommendation Card -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="360" height="110" rx="14" fill="#0a101d" stroke="#00f0ff" stroke-width="1.2" />

      <!-- Best Move Badge -->
      <g transform="translate(18, 16)">
        <rect x="0" y="0" width="94" height="20" rx="10" fill="#0284c7" />
        <text x="47" y="13" fill="#ffffff" font-size="8.5" font-weight="900" letter-spacing="0.5" text-anchor="middle">RECOMMENDED SOW</text>
        <text x="106" y="15" fill="#ffffff" font-size="13" font-weight="900">C4 → CLOCKWISE (+6)</text>
      </g>

      <text x="18" y="58" fill="#94a3b8" font-size="10.5" font-weight="600">Triggers Mtaji Overload on C8 • Lance Damage: 36 HP</text>
      
      <!-- Metrics Row -->
      <g transform="translate(18, 74)">
        <rect x="0" y="0" width="100" height="22" rx="6" fill="#071b2e" />
        <text x="50" y="15" fill="#00f0ff" font-size="9" font-weight="800" text-anchor="middle">WIN PROB: 98.4%</text>

        <rect x="110" y="0" width="100" height="22" rx="6" fill="#201503" />
        <text x="160" y="15" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">NET CORES: +4</text>

        <rect x="220" y="0" width="100" height="22" rx="6" fill="#0f172a" />
        <text x="270" y="15" fill="#e2e8f0" font-size="9" font-weight="800" text-anchor="middle">LANCE: ×36 DMG</text>
      </g>
    </g>

    <!-- Execution & Scrubber Controls -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="360" height="74" rx="14" fill="#0a101d" stroke="#1e293b" stroke-width="1" />

      <!-- Step Counter -->
      <g transform="translate(18, 14)">
        <text x="0" y="10" fill="#64748b" font-size="8" font-weight="800">EXECUTION STEP</text>
        <text x="0" y="26" fill="#ffffff" font-size="13" font-weight="900">STEP 1 / 3</text>
        <text x="0" y="42" fill="#38bdf8" font-size="8.5" font-weight="700">Namua Priming Stage</text>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(170, 16)">
        <rect x="0" y="0" width="78" height="42" rx="21" fill="#0f172a" stroke="#00f0ff" stroke-width="1" />
        <text x="39" y="25" fill="#00f0ff" font-size="10" font-weight="800" text-anchor="middle">‹ STEP</text>

        <rect x="86" y="0" width="86" height="42" rx="21" fill="#00f0ff" filter="url(#glow-cyan6)" />
        <text x="129" y="25" fill="#04182b" font-size="10.5" font-weight="900" text-anchor="middle">PLAY STEP ›</text>
      </g>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 4. BOTTOM GLOBAL COMMAND NAVIGATION TABS -->
  <!-- ============================================================== -->
  <g transform="translate(0, 776)">
    <rect x="0" y="0" width="400" height="84" fill="#070c16" stroke="#1e293b" stroke-width="1" />

    <!-- 1. SECTORS -->
    <g transform="translate(42, 14)">
      <path d="M8 10 l6 -3 l6 3 v8 c0 4 -6 6 -6 6 s-6 -2 -6 -6 z" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">SECTORS</text>
    </g>

    <!-- 2. FLEET -->
    <g transform="translate(118, 14)">
      <polygon points="14,8 20,20 14,17 8,20" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">FLEET</text>
    </g>

    <!-- 3. PILOT -->
    <g transform="translate(194, 14)">
      <circle cx="14" cy="12" r="4" fill="none" stroke="#64748b" stroke-width="1.5" />
      <path d="M8 22 c0 -3 3 -4 6 -4 s6 1 6 4" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">PILOT</text>
    </g>

    <!-- 4. DIRECTIVES (ACTIVE FOR SIM LAB & CODEX) -->
    <g transform="translate(270, 14)">
      <circle cx="14" cy="14" r="12" fill="#00f0ff" fill-opacity="0.15" />
      <rect x="8" y="9" width="12" height="12" rx="2" fill="none" stroke="#00f0ff" stroke-width="1.5" />
      <line x1="11" y1="13" x2="17" y2="13" stroke="#00f0ff" stroke-width="1.2" />
      <line x1="11" y1="17" x2="15" y2="17" stroke="#00f0ff" stroke-width="1.2" />
      <text x="14" y="36" fill="#00f0ff" font-size="8.5" font-weight="800" text-anchor="middle">DIRECTIVES</text>
    </g>

    <!-- 5. SETTINGS -->
    <g transform="translate(344, 14)">
      <circle cx="14" cy="15" r="4" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">SETTINGS</text>
    </g>
  </g>

  <!-- HOME SWIPE BAR -->
  <rect x="135" y="846" width="130" height="4" rx="2" fill="#334155" />
</svg>
