<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" width="100%" height="100%" style="background:#05070f; border-radius:36px; box-shadow:0 25px 60px rgba(0,0,0,0.85); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="glow-cyan5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="modal-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1728" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050a14" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <!-- SCREEN BACKGROUND (DIMMED COMBAT VIEWPORT) -->
  <rect width="400" height="860" rx="36" fill="#03050a" />

  <!-- DIMMED BACKGROUND COMBAT TRACES -->
  <g opacity="0.15">
    <line x1="177.5" y1="92" x2="177.5" y2="700" stroke="#00f0ff" stroke-width="4" />
    <circle cx="177.5" cy="200" r="16" fill="#00f0ff" />
    <circle cx="87.5" cy="280" r="12" fill="#e11d48" />
    <circle cx="267.5" cy="420" r="14" fill="#0284c7" />
    <!-- Battery dock silhouette at bottom -->
    <rect x="20" y="680" width="360" height="120" rx="16" fill="#0f172a" />
  </g>

  <!-- FROSTED BACKDROP SHROUD -->
  <rect width="400" height="860" rx="36" fill="#000000" fill-opacity="0.65" />

  <!-- STATUS BAR -->
  <rect x="145" y="10" width="110" height="28" rx="14" fill="#000000" />
  <circle cx="162" cy="24" r="4.5" fill="#0f172a" />
  <text x="35" y="28" fill="#64748b" font-size="12" font-weight="600">3:56</text>

  <!-- ============================================================== -->
  <!-- TACTICAL PAUSE DRAWER MODAL -->
  <!-- ============================================================== -->
  <g transform="translate(20, 90)">
    <!-- Main Modal Frame -->
    <rect x="0" y="0" width="360" height="660" rx="22" fill="url(#modal-card)" stroke="#00f0ff" stroke-width="1.2" filter="url(#glow-cyan5)" />

    <!-- Top Glow Accent Line -->
    <line x1="40" y1="1" x2="320" y2="1" stroke="#00f0ff" stroke-width="2" />

    <!-- Modal Header -->
    <g transform="translate(24, 28)">
      <text x="0" y="10" fill="#38bdf8" font-size="8.5" font-weight="800" letter-spacing="1.5">TACTICAL ORBITAL SUSPENSION</text>
      <text x="0" y="32" fill="#ffffff" font-size="20" font-weight="900">SIMULATION PAUSED</text>
      <text x="0" y="48" fill="#94a3b8" font-size="10.5" font-weight="600">Sector 1 • Zanzibar Reef Gate (Tier 1)</text>
    </g>

    <!-- Combat Snapshot Telemetry Strip -->
    <g transform="translate(24, 94)">
      <rect x="0" y="0" width="312" height="64" rx="12" fill="#07101d" stroke="#1e293b" stroke-width="1" />
      
      <!-- Current Score -->
      <g transform="translate(18, 12)">
        <text x="0" y="12" fill="#64748b" font-size="8" font-weight="800">CURRENT SCORE</text>
        <text x="0" y="30" fill="#ffffff" font-size="15" font-weight="900">034,820</text>
      </g>

      <line x1="112" y1="12" x2="112" y2="52" stroke="#1e293b" stroke-width="1" />

      <!-- Cores Remaining -->
      <g transform="translate(126, 12)">
        <text x="0" y="12" fill="#64748b" font-size="8" font-weight="800">REACTOR CORES</text>
        <text x="0" y="30" fill="#fbbf24" font-size="15" font-weight="900">36 / 50</text>
      </g>

      <line x1="216" y1="12" x2="216" y2="52" stroke="#1e293b" stroke-width="1" />

      <!-- Shields Primed -->
      <g transform="translate(230, 12)">
        <text x="0" y="12" fill="#64748b" font-size="8" font-weight="800">CANOPY SHIELDS</text>
        <text x="0" y="30" fill="#00f0ff" font-size="15" font-weight="900">2 / 2</text>
      </g>
    </g>

    <!-- Action Buttons Stack (Ergonomic Thumb-Zone) -->
    <g transform="translate(24, 180)">
      <!-- 1. RESUME COMBAT (HERO PRIMARY BUTTON) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="312" height="50" rx="25" fill="#00f0ff" filter="url(#glow-cyan5)" />
        <polygon points="120,25 110,18 110,32" fill="#04182b" />
        <text x="132" y="30" fill="#04182b" font-size="12" font-weight="900" letter-spacing="0.8">RESUME COMBAT</text>
      </g>

      <!-- 2. RESTART SECTOR -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="312" height="46" rx="23" fill="#0a1220" stroke="#0284c7" stroke-width="1.2" />
        <circle cx="110" cy="23" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2" />
        <text x="126" y="27" fill="#ffffff" font-size="11" font-weight="800" letter-spacing="0.5">RESTART SECTOR</text>
      </g>

      <!-- 3. STAR MAP / SECTORS -->
      <g transform="translate(0, 116)">
        <rect x="0" y="0" width="312" height="46" rx="23" fill="#0a1220" stroke="#1e293b" stroke-width="1" />
        <path d="M104 18 l6 -3 l6 3 v6 c0 4 -6 6 -6 6 s-6 -2 -6 -6 z" fill="none" stroke="#64748b" stroke-width="1.3" />
        <text x="124" y="27" fill="#e2e8f0" font-size="11" font-weight="700" letter-spacing="0.5">SECTORS &amp; CAMPAIGN MAP</text>
      </g>

      <!-- 4. FLIGHT ACADEMY DIRECTIVES -->
      <g transform="translate(0, 172)">
        <rect x="0" y="0" width="312" height="46" rx="23" fill="#0a1220" stroke="#1e293b" stroke-width="1" />
        <rect x="104" y="17" width="12" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="1.3" />
        <text x="124" y="27" fill="#e2e8f0" font-size="11" font-weight="700" letter-spacing="0.5">FLIGHT ACADEMY CODEX</text>
      </g>

      <!-- 5. SETTINGS & AUDIO -->
      <g transform="translate(0, 228)">
        <rect x="0" y="0" width="312" height="46" rx="23" fill="#0a1220" stroke="#1e293b" stroke-width="1" />
        <circle cx="110" cy="23" r="5" fill="none" stroke="#64748b" stroke-width="1.3" />
        <text x="124" y="27" fill="#e2e8f0" font-size="11" font-weight="700" letter-spacing="0.5">SETTINGS &amp; AUDIO</text>
      </g>

      <!-- 6. ABORT SORTIE -->
      <g transform="translate(0, 284)">
        <rect x="0" y="0" width="312" height="44" rx="22" fill="#180b11" stroke="#e11d48" stroke-width="1" stroke-opacity="0.4" />
        <text x="156" y="26" fill="#f43f5e" font-size="10.5" font-weight="800" letter-spacing="0.6" text-anchor="middle">ABORT TO ORBITAL COMMAND</text>
      </g>
    </g>

    <!-- Quick Audio & Hardware Controls Strip -->
    <g transform="translate(24, 536)">
      <rect x="0" y="0" width="312" height="88" rx="12" fill="#070c16" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="18" fill="#64748b" font-size="8" font-weight="800" letter-spacing="0.5">QUICK HARDWARE TOGGLES</text>

      <!-- Toggles Row -->
      <g transform="translate(16, 30)">
        <!-- SFX -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="62" height="40" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="1" />
          <text x="31" y="16" fill="#64748b" font-size="7.5" font-weight="800" text-anchor="middle">SFX</text>
          <text x="31" y="30" fill="#00f0ff" font-size="9" font-weight="900" text-anchor="middle">ON</text>
        </g>

        <!-- MUSIC -->
        <g transform="translate(72, 0)">
          <rect x="0" y="0" width="62" height="40" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="1" />
          <text x="31" y="16" fill="#64748b" font-size="7.5" font-weight="800" text-anchor="middle">MUSIC</text>
          <text x="31" y="30" fill="#00f0ff" font-size="9" font-weight="900" text-anchor="middle">ON</text>
        </g>

        <!-- HAPTICS -->
        <g transform="translate(144, 0)">
          <rect x="0" y="0" width="62" height="40" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="1" />
          <text x="31" y="16" fill="#64748b" font-size="7.5" font-weight="800" text-anchor="middle">HAPTIC</text>
          <text x="31" y="30" fill="#00f0ff" font-size="9" font-weight="900" text-anchor="middle">ON</text>
        </g>

        <!-- AI AUTO-PILOT -->
        <g transform="translate(216, 0)">
          <rect x="0" y="0" width="64" height="40" rx="8" fill="#0b111e" stroke="#1e293b" stroke-width="1" />
          <text x="32" y="16" fill="#64748b" font-size="7.5" font-weight="800" text-anchor="middle">AI SOLVER</text>
          <text x="32" y="30" fill="#64748b" font-size="9" font-weight="800" text-anchor="middle">OFF</text>
        </g>
      </g>
    </g>
  </g>

  <!-- HOME SWIPE BAR -->
  <rect x="135" y="846" width="130" height="4" rx="2" fill="#334155" />
</svg>
