<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" width="100%" height="100%" style="background:#05070f; border-radius:36px; box-shadow:0 25px 60px rgba(0,0,0,0.85); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="glow-cyan4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-gold4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="profile-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c233c" />
      <stop offset="100%" stop-color="#071322" />
    </linearGradient>
  </defs>

  <!-- SCREEN BACKGROUND -->
  <rect width="400" height="860" rx="36" fill="#05070f" />

  <!-- STATUS BAR -->
  <rect x="145" y="10" width="110" height="28" rx="14" fill="#000000" />
  <circle cx="162" cy="24" r="4.5" fill="#0f172a" />
  <text x="35" y="28" fill="#64748b" font-size="12" font-weight="600">3:56</text>

  <!-- ============================================================== -->
  <!-- 1. HEADER & RANK READOUT -->
  <!-- ============================================================== -->
  <g transform="translate(20, 52)">
    <text x="0" y="10" fill="#38bdf8" font-size="8.5" font-weight="800" letter-spacing="1.5">VOID SOWER // PILOT TELEMETRY</text>
    <text x="0" y="32" fill="#ffffff" font-size="20" font-weight="900">COMMAND RECORD</text>
    
    <!-- Rank Badge Pill -->
    <g transform="translate(244, 10)">
      <rect x="0" y="0" width="116" height="26" rx="13" fill="#201503" stroke="#f59e0b" stroke-width="1" />
      <circle cx="14" cy="13" r="5" fill="#fbbf24" />
      <text x="26" y="17" fill="#fef3c7" font-size="8.5" font-weight="800">FLEET ADMIRAL</text>
    </g>

    <!-- Progress Track -->
    <rect x="0" y="44" width="360" height="4" rx="2" fill="#1e293b" />
    <rect x="0" y="44" width="280" height="4" rx="2" fill="#fbbf24" filter="url(#glow-gold4)" />
  </g>

  <!-- TELEMETRY TABS -->
  <g transform="translate(20, 116)">
    <rect x="0" y="0" width="112" height="32" rx="16" fill="#0284c7" />
    <text x="56" y="20" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">OVERVIEW</text>

    <rect x="120" y="0" width="112" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="176" y="20" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">ACCOLADES</text>

    <rect x="240" y="0" width="120" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="300" y="20" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">LOG ARCHIVE</text>
  </g>

  <!-- ============================================================== -->
  <!-- 2. PILOT DOSSIER HERO CARD -->
  <!-- ============================================================== -->
  <g transform="translate(20, 164)">
    <rect x="0" y="0" width="360" height="216" rx="18" fill="url(#profile-card)" stroke="#00f0ff" stroke-width="1.5" />

    <!-- Avatar Hexagon Frame -->
    <g transform="translate(22, 22)">
      <!-- Hexagon background -->
      <polygon points="32,0 64,18 64,54 32,72 0,54 0,18" fill="#082f49" stroke="#00f0ff" stroke-width="1.8" filter="url(#glow-cyan4)" />
      <!-- Pilot Icon Silhouette -->
      <circle cx="32" cy="28" r="12" fill="#38bdf8" />
      <path d="M16 56 c0 -8 7 -12 16 -12 s16 4 16 12" fill="#00f0ff" />
      <!-- Golden Laurel Badge -->
      <circle cx="56" cy="58" r="9" fill="#f59e0b" stroke="#1c0f01" stroke-width="1.5" />
      <text x="56" y="62" fill="#1c0f01" font-size="8" font-weight="900" text-anchor="middle">★</text>
    </g>

    <!-- Pilot Metadata -->
    <g transform="translate(102, 26)">
      <Row>
        <rect x="0" y="0" width="70" height="16" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="0.8" />
        <text x="35" y="11" fill="#fbbf24" font-size="8" font-weight="900" letter-spacing="0.5" text-anchor="middle">PRO PILOT</text>
      </Row>
      <text x="0" y="38" fill="#ffffff" font-size="16" font-weight="900">CMDR. TARIQ NYERERE</text>
      <text x="0" y="52" fill="#94a3b8" font-size="9.5" font-weight="600">Kilwa Liberation Fleet • ID #849-VS</text>
      <text x="0" y="66" fill="#38bdf8" font-size="8.5" font-weight="700">SERVICE RECORD: 184 COMBAT DROPS</text>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="112" x2="340" y2="112" stroke="#1e293b" stroke-width="1" />

    <!-- 3 Core Career Metrics -->
    <g transform="translate(20, 126)">
      <!-- Metric 1: Total Stars -->
      <g transform="translate(10, 0)">
        <text x="36" y="14" fill="#64748b" font-size="8" font-weight="800" text-anchor="middle">CAMPAIGN STARS</text>
        <text x="36" y="34" fill="#fbbf24" font-size="16" font-weight="900" text-anchor="middle">★ 78 / 81</text>
        <text x="36" y="48" fill="#38bdf8" font-size="8.5" font-weight="700" text-anchor="middle">96% LIBERATED</text>
      </g>

      <!-- Vertical subtle separator -->
      <line x1="106" y1="4" x2="106" y2="52" stroke="#1e293b" stroke-width="1" />

      <!-- Metric 2: Best Combat Score -->
      <g transform="translate(120, 0)">
        <text x="44" y="14" fill="#64748b" font-size="8" font-weight="800" text-anchor="middle">PEAK SCORE</text>
        <text x="44" y="34" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle">148,920</text>
        <text x="44" y="48" fill="#94a3b8" font-size="8.5" font-weight="700" text-anchor="middle">TOP 1% GLOBAL</text>
      </g>

      <!-- Vertical subtle separator -->
      <line x1="218" y1="4" x2="218" y2="52" stroke="#1e293b" stroke-width="1" />

      <!-- Metric 3: Lance Accuracy -->
      <g transform="translate(230, 0)">
        <text x="40" y="14" fill="#64748b" font-size="8" font-weight="800" text-anchor="middle">LANCE ACCURACY</text>
        <text x="40" y="34" fill="#00f0ff" font-size="16" font-weight="900" text-anchor="middle">94.8%</text>
        <text x="40" y="48" fill="#38bdf8" font-size="8.5" font-weight="700" text-anchor="middle">S-TIER AIM</text>
      </g>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 3. BATTLE ACCOLADES & CITATIONS -->
  <!-- ============================================================== -->
  <g transform="translate(20, 396)">
    <!-- Subheader -->
    <text x="0" y="12" fill="#38bdf8" font-size="9" font-weight="900" letter-spacing="1">HONORS &amp; CITATIONS</text>

    <!-- Accolade 1: Mtaji Overload Grandmaster -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="360" height="66" rx="14" fill="#0a101d" stroke="#1e293b" stroke-width="1" />
      <circle cx="28" cy="33" r="16" fill="#071b2e" stroke="#00f0ff" stroke-width="1.2" />
      <!-- Beam detonation icon -->
      <polygon points="28,21 34,29 42,29 36,35 38,44 28,39 18,44 20,35 14,29 22,29" fill="#00f0ff" />
      <text x="56" y="24" fill="#ffffff" font-size="12.5" font-weight="800">Mtaji Overload Master</text>
      <text x="56" y="39" fill="#64748b" font-size="9" font-weight="600">Detonated 500+ Quadratic Axial Lances</text>
      <!-- Progress Bar -->
      <rect x="56" y="47" width="180" height="3" rx="1.5" fill="#1e293b" />
      <rect x="56" y="47" width="180" height="3" rx="1.5" fill="#00f0ff" />
      <text x="320" y="37" fill="#fbbf24" font-size="10" font-weight="900" text-anchor="end">GOLD</text>
    </g>

    <!-- Accolade 2: Kilwa Basin Liberator -->
    <g transform="translate(0, 98)">
      <rect x="0" y="0" width="360" height="66" rx="14" fill="#0a101d" stroke="#1e293b" stroke-width="1" />
      <circle cx="28" cy="33" r="16" fill="#201503" stroke="#f59e0b" stroke-width="1.2" />
      <!-- Shield laurel icon -->
      <path d="M22 25 l6 -3 l6 3 v6 c0 4 -6 6 -6 6 s-6 -2 -6 -6 z" fill="none" stroke="#fbbf24" stroke-width="1.4" />
      <text x="56" y="24" fill="#ffffff" font-size="12.5" font-weight="800">Kilwa Basin Vanguard</text>
      <text x="56" y="39" fill="#64748b" font-size="9" font-weight="600">3-Star Mastery on all 9 Kilwa Sectors</text>
      <rect x="56" y="47" width="180" height="3" rx="1.5" fill="#1e293b" />
      <rect x="56" y="47" width="180" height="3" rx="1.5" fill="#f59e0b" />
      <text x="320" y="37" fill="#fbbf24" font-size="10" font-weight="900" text-anchor="end">COMPLETED</text>
    </g>

    <!-- Accolade 3: Nyumba Kinetic Shield -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="360" height="66" rx="14" fill="#0a101d" stroke="#1e293b" stroke-width="1" />
      <circle cx="28" cy="33" r="16" fill="#071b2e" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="28" cy="33" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="28" cy="33" r="3" fill="#fbbf24" />
      <text x="56" y="24" fill="#ffffff" font-size="12.5" font-weight="800">Nyumba Vault Aegis</text>
      <text x="56" y="39" fill="#64748b" font-size="9" font-weight="600">Deflected 250+ Bombs with Sub-Deck Energy</text>
      <rect x="56" y="47" width="180" height="3" rx="1.5" fill="#1e293b" />
      <rect x="56" y="47" width="144" height="3" rx="1.5" fill="#38bdf8" />
      <text x="320" y="37" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="end">200 / 250</text>
    </g>

    <!-- Accolade 4: Void Incursion Wave Master (LOCKED) -->
    <g transform="translate(0, 246)">
      <rect x="0" y="0" width="360" height="66" rx="14" fill="#080c16" stroke="#1e293b" stroke-width="1" opacity="0.6" />
      <circle cx="28" cy="33" r="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <path d="M25 33 h6 v6 h-6 z M26 33 v-3 a2 2 0 0 1 4 0 v3" fill="none" stroke="#64748b" stroke-width="1.2" />
      <text x="56" y="24" fill="#64748b" font-size="12.5" font-weight="800">Incursion Wave 20 Vanguard</text>
      <text x="56" y="39" fill="#475569" font-size="9" font-weight="600">Survive 20 Endless Incursion Waves</text>
      <text x="320" y="37" fill="#64748b" font-size="9" font-weight="800" text-anchor="end">LOCKED</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 4. BOTTOM GLOBAL COMMAND NAVIGATION TABS -->
  <!-- ============================================================== -->
  <g transform="translate(0, 776)">
    <rect x="0" y="0" width="400" height="84" fill="#070c16" stroke="#1e293b" stroke-width="1" />

    <!-- 1. SECTORS -->
    <g transform="translate(42, 14)">
      <path d="M8 10 l6 -3 l6 3 v8 c0 4 -6 6 -6 6 s-6 -2 -6 -6 z" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">SECTORS</text>
    </g>

    <!-- 2. FLEET -->
    <g transform="translate(118, 14)">
      <polygon points="14,8 20,20 14,17 8,20" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">FLEET</text>
    </g>

    <!-- 3. PILOT (ACTIVE) -->
    <g transform="translate(194, 14)">
      <circle cx="14" cy="14" r="12" fill="#00f0ff" fill-opacity="0.15" />
      <circle cx="14" cy="12" r="4" fill="none" stroke="#00f0ff" stroke-width="1.5" />
      <path d="M8 22 c0 -3 3 -4 6 -4 s6 1 6 4" fill="none" stroke="#00f0ff" stroke-width="1.5" />
      <text x="14" y="36" fill="#00f0ff" font-size="8.5" font-weight="800" text-anchor="middle">PILOT</text>
    </g>

    <!-- 4. DIRECTIVES -->
    <g transform="translate(270, 14)">
      <rect x="8" y="9" width="12" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
      <line x1="11" y1="13" x2="17" y2="13" stroke="#64748b" stroke-width="1.2" />
      <line x1="11" y1="17" x2="15" y2="17" stroke="#64748b" stroke-width="1.2" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">DIRECTIVES</text>
    </g>

    <!-- 5. SETTINGS -->
    <g transform="translate(344, 14)">
      <circle cx="14" cy="15" r="4" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="14" y="36" fill="#64748b" font-size="8.5" font-weight="700" text-anchor="middle">SETTINGS</text>
    </g>
  </g>

  <!-- HOME SWIPE BAR -->
  <rect x="135" y="846" width="130" height="4" rx="2" fill="#334155" />
</svg>
